# Non-sensitive configuration for the Central Payment Portal.
# Sensitive values (MongoDB URI, EaseBuzz keys, Admin key) live in secret.yaml.
#
# After changing any value here, restart pods to pick it up:
#   kubectl rollout restart deployment/central-payment-api -n central-payment

apiVersion: v1
kind: ConfigMap
metadata:
  name: central-payment-config
  namespace: central-payment
  labels:
    app: central-payment-api
data:
  # Application
  HOST: "0.0.0.0"
  PORT: "8000"

  # MongoDB
  MONGODB_DB_NAME: "central_payment"
  MONGO_MAX_POOL_SIZE: "50"   # per pod — tune up if Atlas tier allows more connections
  MONGO_MIN_POOL_SIZE: "10"   # warm connections kept alive per pod

  # EaseBuzz
  # Switch to "prod" once staging tests pass
  EASEBUZZ_ENV: "prod"
  EASEBUZZ_FEE_PERCENT: "2.00"

  # This must match the ingress host below + the webhook route
  # EaseBuzz will POST payment results to this URL
  PORTAL_CALLBACK_URL: "https://api.accommodationstiet.shop/webhook/easebuzz"
